<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este videos está hopedado no meu própio servidor.</p>

    <video width="500" poster="imagens/THUMB.png" controls>
        
        <source src="midia/convertido 720 30fps.mp4" type="video/mp4_720">
        <source src="midia/7126452-hd_1920_1080_30fps.mp4" type="video/mp4">
        <source src="midia/convertido ogv.ogv" type="video/ogv">
        <P>Seu navegador não tem compatibilidade com reprodução de videos.</P>
    </video>

    <h1>Inserindo videos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/3hng-hmSv2Y?si=4oj-Q8pcI6RixQxh" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
</body>
</html>
