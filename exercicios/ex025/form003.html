<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formmulário</h1>
    <form action="cadastro.php">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Digite seu nome Completo" autocomplete="name">
        </p>
            <p>
                <label for="media" >Média</label>
                <input type="number" name="media" idimedia min="0" max="10" placeholder="0 a 10" step="0.1" value="5">
            </p>
            <p>
                <label for="imes"> Periodo Letivo</label>
                <input type="month" name="mes" id="imes" value="2026-07">
            </p>
        <p>
            <label for="idia" >Dia da prova</label>
            <input type="date" name="date" id="idate" value="2026-02-10">
        </p>
        <p>
            <label for="time" > Hora da prova</label>
            <input type="time" name="time" id="itime" value="13:00" >
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Excluir">
        </p>
    </form>
</body>
</html>
