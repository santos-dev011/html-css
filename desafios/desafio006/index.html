<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <P>Em HMTL5 podemos inserir os elementos da lista a seguir. Passe o mause sobre os termos para descobrir qual tag devrá utilizar em cada caso.</P>
    <ul type="disc">
        <li title="&lt;p&gt;">Paragráfos</li>
        <li title="&lt;h1&gt;...&lt;h6&gt;">Títulos</li>
        <li title="&lt;img&gt;">Imagens</li>
        <li title="&lt;abbr&gt;">Abreviações</li>
        <li title="&lt;code&gt;">Código Fonte</li>
        <li title="&lt;ol&gt; e &lt;li&gt;">Listas númeradas</li>
        <li title="&lt;ul&gt; e &lt;li&gt;">Listas com Demarcadores</li>
    </ul>
    
</body>
